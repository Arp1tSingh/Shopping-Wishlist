  <path d="M47.8 17.2a9.6 9.6 0 0 0-13.6 0L32 19.4l-2.2-2.2a9.6 9.6 0 0 0-13.6 13.6L32 46.8l15.8-16a9.6 9.6 0 0 0 0-13.6z"
